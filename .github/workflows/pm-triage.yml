name: PM Triage Auto-Labeling

on:
  issues:
    types: [opened, edited]

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply Labels Based on Title
        uses: actions/github-script@v6
        with:
          script: |
            const title = context.payload.issue.title;
            const issueId = context.payload.issue.node_id;
            const existingLabels = context.payload.issue.labels ? context.payload.issue.labels.map(l => l.name) : [];
            const action = context.payload.action;

            // Mapping prefixes to Native Issue Type IDs
            const typeMap = {
              'Epic': 'IT_kwDOD_xoo84B9jcQ',
              'Bug': 'IT_kwDOD_xoo84B9jb4',
              'Task': 'IT_kwDOD_xoo84B9jcF',
              'Analysis': 'IT_kwDOD_xoo84B9jcM',
              'Feature': 'IT_kwDOD_xoo84B9jbx',
              'Documentation': 'IT_kwDOD_xoo84B9jfy'
            };

            let targetTypeId = null;
            if (/\[EPIC\]/i.test(title)) targetTypeId = typeMap['Epic'];
            else if (/\[BUG\]/i.test(title)) targetTypeId = typeMap['Bug'];
            else if (/\[TASK\]/i.test(title)) targetTypeId = typeMap['Task'];
            else if (/\[ANALYSIS\]/i.test(title)) targetTypeId = typeMap['Analysis'];
            else if (/\[FEATURE\]/i.test(title)) targetTypeId = typeMap['Feature'];
            else if (/\[DOCS\]|\[DOCUMENTATION\]/i.test(title)) targetTypeId = typeMap['Documentation'];

            // 1. Update Native Issue Type via GraphQL
            if (targetTypeId) {
              await github.graphql(`
                mutation($id: ID!, $typeId: ID!) {
                  updateIssue(input: { id: $id, issueTypeId: $typeId }) {
                    issue { id }
                  }
                }
              `, {
                id: issueId,
                typeId: targetTypeId,
                headers: {
                  'GraphQL-Features': 'issue_types'
                }
              });
            }

            // 2. Manage status:not-ready Label
            const isEpic = targetTypeId === typeMap['Epic'];
            const labelName = 'status:not-ready';
            const hasLabel = existingLabels.includes(labelName);

            // Apply status:not-ready to non-Epics by default when opened
            let shouldHaveLabel = false;
            if (!isEpic) {
              if (action === 'opened' || hasLabel) {
                shouldHaveLabel = true;
              }
            }

            if (shouldHaveLabel && !hasLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [labelName]
              });
            } else if (!shouldHaveLabel && hasLabel) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: labelName
                });
              } catch (error) {
                // Ignore
              }
            }
